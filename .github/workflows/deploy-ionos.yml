name: Deploy IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload via SFTP
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: bash scripts/deploy-ionos.sh
